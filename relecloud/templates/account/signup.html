{% extends "base.html" %}

{% block title %}Registro - ReleCloud{% endblock %}

{% block content %}
<h1 class="display-4 tk-elevon">Crear cuenta</h1>

<form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Registrarse</button>
</form>

<p class="mt-3">
    ¿Ya tienes cuenta?
    <a href="{% url 'account_login' %}">Inicia sesión aquí</a>.
</p>
{% endblock %}
