{% extends "base.html" %}

{% block title %}Iniciar sesión - ReleCloud{% endblock %}

{% block content %}
<h1 class="display-4 tk-elevon">Iniciar sesión</h1>

<form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
</form>

<p class="mt-3">
    ¿No tienes cuenta?
    <a href="{% url 'account_signup' %}">Regístrate aquí</a>.
</p>
{% endblock %}
